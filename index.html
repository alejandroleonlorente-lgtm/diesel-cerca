<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diésel Cerca</title>
<meta name="theme-color" content="#0C1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diésel Cerca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#11181D; --muted:#5A6770; --line:#D8DFE4;
  --accent:#1F4FA3; --accent-ink:#FFFFFF; --accent-soft:#E3EBF8;
  --good:#128553; --mid:#9A6A00; --bad:#C2323A;
  --totem:#0F151A; --led-good:#3BE08F; --led-mid:#FFC24A; --led-bad:#FF6468; --led-dim:#7E8B94;
  --shadow:0 10px 30px rgba(17,24,29,.16), 0 2px 6px rgba(17,24,29,.08);
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1115; --surface:#151C22; --surface-2:#1B242B; --ink:#E8EDF0; --muted:#93A1AB; --line:#27323B;
    --accent:#7AA4FF; --accent-ink:#0C1115; --accent-soft:#1B2A45;
    --good:#3BD08A; --mid:#F2B33D; --bad:#FF6B6F;
    --shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1115; --surface:#151C22; --surface-2:#1B242B; --ink:#E8EDF0; --muted:#93A1AB; --line:#27323B;
  --accent:#7AA4FF; --accent-ink:#0C1115; --accent-soft:#1B2A45;
  --good:#3BD08A; --mid:#F2B33D; --bad:#FF6B6F;
  --shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

#mapa{position:fixed;inset:0;background:var(--bg);z-index:0}
.leaflet-container{font:inherit;background:var(--bg)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}

/* Barra superior */
.barra{position:fixed;left:0;right:0;top:0;z-index:500;padding:calc(var(--safe-top) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.marca{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;box-shadow:var(--shadow);min-width:0}
.marca .logo{width:34px;height:34px;border-radius:9px;background:var(--totem);display:grid;place-items:center;flex:none}
.marca h1{margin:0;font:700 19px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.marca .act{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.producto{pointer-events:auto;margin-left:auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow);flex:none}
.producto button{border:0;background:transparent;padding:8px 11px;border-radius:9px;font:600 14px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.producto button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Botones flotantes */
.flotantes{position:fixed;right:12px;z-index:450;display:flex;flex-direction:column;gap:8px;bottom:calc(var(--sheet-h,300px) + 12px);transition:bottom .3s ease}
.fab{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:22px;height:22px}
.fab.activo{color:var(--accent)}
.buscar-aqui{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-top) + 72px);z-index:450;border:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font:600 14px/1 var(--body);box-shadow:var(--shadow)}

/* Hoja inferior */
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:600;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;height:var(--sheet-h,300px);transition:height .3s ease;padding-bottom:var(--safe-bottom)}
.tirador{border:0;background:transparent;padding:10px 0 4px;display:grid;place-items:center;flex:none}
.tirador span{width:40px;height:5px;border-radius:3px;background:var(--line)}
.cabecera{padding:4px 16px 12px;flex:none;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}

.mejor{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:0;background:transparent;text-align:left;padding:0}
.totem{background:var(--totem);border-radius:12px;padding:8px 12px 7px;min-width:112px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.totem .etq{font:600 10px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--led-dim)}
.totem .precio{font:700 38px/1 var(--display);color:var(--led-good);letter-spacing:.01em;text-shadow:0 0 14px color-mix(in srgb,var(--led-good) 45%,transparent);margin-top:3px}
.totem .precio small{font-size:17px;color:var(--led-dim);text-shadow:none;margin-left:2px}
.mejor .info{min-width:0}
.mejor .eyebrow{font:600 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--good)}
.mejor .nombre{font:700 21px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mejor .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dato{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.dato .k{font:600 10.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dato .v{font:700 20px/1.1 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.dato .v.ahorro{color:var(--good)}

.controles{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.controles::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font:500 13.5px/1 var(--body);color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

.lista{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 0 16px;margin:0;list-style:none}
.fila{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent}
.fila:hover{background:var(--surface-2)}
.fila.sel{background:var(--accent-soft)}
.fila .pos{font:600 15px/1 var(--display);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.fila .nom{font:600 16px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .dir{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .meta{display:flex;gap:8px;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.badge{font:600 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:5px}
.badge.abierta{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.badge.cerrada{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.fila .der{text-align:right}
.fila .p{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.fila .p.t-good{color:var(--good)} .fila .p.t-mid{color:var(--ink)} .fila .p.t-bad{color:var(--bad)}
.delta{font:600 12px/1 var(--display);font-variant-numeric:tabular-nums;margin-top:4px;display:block}
.delta.baja{color:var(--good)} .delta.sube{color:var(--bad)} .delta.igual{color:var(--muted)}
.vacio{padding:28px 20px;text-align:center;color:var(--muted)}
.vacio strong{display:block;color:var(--ink);font:700 18px/1.2 var(--display);text-transform:uppercase;margin-bottom:6px}

/* Marcadores */
.pin{background:var(--totem);color:var(--led-mid);border-radius:8px;padding:4px 7px 3px;font:700 15px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.35);position:relative;transform:translate(-50%,-100%);display:inline-block;border:1px solid rgba(255,255,255,.08);transition:transform .15s}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--totem)}
.pin.t-good{color:var(--led-good)} .pin.t-bad{color:var(--led-bad)}
.pin.top{outline:2px solid var(--led-good);outline-offset:1px}
.pin.sel{transform:translate(-50%,-100%) scale(1.22);z-index:1000;outline:2px solid #fff}
.punto{width:12px;height:12px;border-radius:50%;background:var(--led-mid);border:2px solid var(--totem);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.punto.t-good{background:var(--led-good)} .punto.t-bad{background:var(--led-bad)}
.divpin{background:transparent;border:0}
.yo{width:18px;height:18px;border-radius:50%;background:#2F6BFF;border:3px solid #fff;box-shadow:0 0 0 0 rgba(47,107,255,.5);animation:latido 2s infinite;transform:translate(-50%,-50%)}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(47,107,255,.5)}70%{box-shadow:0 0 0 16px rgba(47,107,255,0)}100%{box-shadow:0 0 0 0 rgba(47,107,255,0)}}

/* Popup */
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:var(--shadow);padding:0}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:0;width:260px!important}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted);top:6px;right:6px}
.pop{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.pop .nom{font:700 20px/1.1 var(--display);text-transform:uppercase;padding-right:18px}
.pop .dir{font-size:13px;color:var(--muted);margin-top:2px}
.pop .precios{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pop .pr{background:var(--totem);border-radius:9px;padding:7px 9px}
.pop .pr .etq{font:600 9.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--led-dim)}
.pop .pr .v{font:700 22px/1.1 var(--display);color:var(--led-mid);font-variant-numeric:tabular-nums}
.pop .pr .v.t-good{color:var(--led-good)} .pop .pr .v.t-bad{color:var(--led-bad)}
.pop .horario{font-size:12.5px;color:var(--muted)}
.pop .ir{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink)!important;text-decoration:none;border-radius:11px;padding:11px;font:600 15px/1 var(--body)}

.aviso{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-top) + 72px);z-index:700;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.cargando{position:fixed;inset:0;z-index:900;background:var(--bg);display:grid;place-items:center;transition:opacity .4s}
.cargando.fuera{opacity:0;pointer-events:none}
.cargando .c{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted);font:600 13px/1 var(--display);letter-spacing:.16em;text-transform:uppercase}
.cargando .digs{font:700 56px/1 var(--display);color:var(--led-good);background:var(--totem);padding:10px 18px;border-radius:14px;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(59,224,143,.45)}

@media (min-width:900px){
  .hoja{left:12px;right:auto;top:calc(var(--safe-top) + 74px);bottom:12px;width:400px;height:auto!important;border-radius:20px;box-shadow:var(--shadow)}
  .tirador{display:none}
  .flotantes{bottom:24px}
  .barra{padding-left:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="cargando" id="cargando">
  <div class="c"><div class="digs" id="digs">1,---</div><span id="cargandoTxt">Cargando precios</span></div>
</div>

<div id="mapa" aria-label="Mapa de gasolineras"></div>

<header class="barra">
  <div class="marca">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#3BE08F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 21h12"/><path d="M7 8h4"/><path d="M14 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg>
    </div>
    <div style="min-width:0">
      <h1>Diésel Cerca</h1>
      <div class="act" id="actualizado">—</div>
    </div>
  </div>
  <div class="producto" role="group" aria-label="Carburante">
    <button id="pA" aria-pressed="true">Diésel</button>
    <button id="pP" aria-pressed="false">Diésel+</button>
  </div>
</header>

<button class="buscar-aqui" id="buscarAqui" hidden>Buscar en esta zona</button>
<div class="aviso" id="aviso" hidden></div>

<div class="flotantes">
  <button class="fab activo" id="btnYo" aria-label="Centrar en mi ubicación">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</div>

<section class="hoja" id="hoja" aria-label="Gasolineras">
  <button class="tirador" id="tirador" aria-label="Ampliar o reducir la lista"><span></span></button>
  <div class="cabecera">
    <button class="mejor" id="mejor">
      <div class="totem"><div class="etq" id="mejorEtq">Gasóleo A</div><div class="precio num" id="mejorPrecio">—<small>€/L</small></div></div>
      <div class="info">
        <div class="eyebrow">La más barata cerca</div>
        <div class="nombre" id="mejorNombre">—</div>
        <div class="sub" id="mejorSub">—</div>
      </div>
    </button>
    <div class="resumen">
      <div class="dato"><div class="k">Media zona</div><div class="v" id="rMedia">—</div></div>
      <div class="dato"><div class="k">Más cara</div><div class="v" id="rMax">—</div></div>
      <div class="dato"><div class="k" id="rAhorroK">Ahorro 50 L</div><div class="v ahorro" id="rAhorro">—</div></div>
    </div>
    <div class="controles" role="toolbar" aria-label="Filtros">
      <button class="chip" data-radio="3">3 km</button>
      <button class="chip" data-radio="5">5 km</button>
      <button class="chip" data-radio="10">10 km</button>
      <button class="chip" data-radio="20">20 km</button>
      <span class="sep"></span>
      <button class="chip" data-orden="precio">Por precio</button>
      <button class="chip" data-orden="dist">Por distancia</button>
      <span class="sep"></span>
      <button class="chip" id="soloAbiertas" aria-pressed="false">Abiertas ahora</button>
      <button class="chip" id="deposito">Depósito 50 L</button>
    </div>
  </div>
  <ul class="lista" id="lista"></ul>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const PATERNA = [39.5025, -0.4406];
  const API = "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/";
  const LITROS_OPC = [40, 50, 60, 70];

  // ---------- estado ----------
  const guardado = (k, d) => { try { const v = localStorage.getItem("dc_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const guardar = (k, v) => { try { localStorage.setItem("dc_" + k, JSON.stringify(v)); } catch {} };
  const st = {
    estaciones: [], centro: guardado("centro", PATERNA), yo: null,
    radio: guardado("radio", 5), orden: guardado("orden", "precio"),
    prod: guardado("prod", "A"), soloAbiertas: guardado("abiertas", false), litros: guardado("litros", 50),
    sel: null, visibles: [], expandida: false
  };

  // ---------- utilidades ----------
  const $ = id => document.getElementById(id);
  const eur = (v, d = 3) => v == null ? "—" : v.toFixed(d).replace(".", ",");
  const km = d => d < 1 ? Math.round(d * 1000) + " m" : d.toFixed(d < 10 ? 1 : 0).replace(".", ",") + " km";
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const titulo = s => String(s || "").toLowerCase().replace(/(^|[\s\-/.(])([a-záéíóúñü])/g, (m, a, b) => a + b.toUpperCase());
  function dist(a, b) {
    const R = 6371, r = x => x * Math.PI / 180;
    const dLat = r(b[0] - a[0]), dLon = r(b[1] - a[1]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function aviso(txt, ms = 3500) {
    const a = $("aviso"); a.textContent = txt; a.hidden = false;
    clearTimeout(aviso.t); aviso.t = setTimeout(() => a.hidden = true, ms);
  }

  // Horario tipo "L-V: 06:00-22:00; S: 07:00-14:00" o "L-D: 24H"
  const DIAS = "LMXJVSD";
  function abiertaAhora(h, ahora = new Date()) {
    if (!h) return null;
    const hoy = (ahora.getDay() + 6) % 7, min = ahora.getHours() * 60 + ahora.getMinutes();
    let entendido = false, cubreHoy = false;
    for (const seg of h.toUpperCase().split(";")) {
      const m = seg.match(/^\s*([LMXJVSD])(?:\s*-\s*([LMXJVSD]))?\s*:\s*(.+)$/);
      if (!m) continue;
      entendido = true;
      const a = DIAS.indexOf(m[1]), b = m[2] ? DIAS.indexOf(m[2]) : a;
      const incluye = a <= b ? (hoy >= a && hoy <= b) : (hoy >= a || hoy <= b);
      if (!incluye) continue;
      cubreHoy = true;
      if (/24\s*H/.test(m[3])) return true;
      for (const r of m[3].matchAll(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/g)) {
        const i = +r[1] * 60 + +r[2], f = +r[3] * 60 + +r[4];
        if (f > i ? (min >= i && min < f) : (min >= i || min < f)) return true;
      }
    }
    return entendido ? false : null;
  }

  // ---------- datos ----------
  const num = s => { if (s == null || s === "") return null; const v = parseFloat(String(s).replace(",", ".")); return isFinite(v) && v > 0 ? v : null; };
  const coord = s => { const v = parseFloat(String(s ?? "").replace(",", ".")); return isFinite(v) ? v : null; };
  function desdeCompacto(j) {
    return {
      actualizado: j.actualizado,
      estaciones: j.estaciones.map(e => ({ id: e[0], lat: e[1], lon: e[2], A: e[3], P: e[4], dA: e[5], dP: e[6], rotulo: e[7], dir: e[8], loc: e[9], horario: e[10] }))
    };
  }
  function desdeApi(j) {
    const est = [];
    for (const e of j.ListaEESSPrecio || []) {
      if (e["Tipo Venta"] && e["Tipo Venta"] !== "P") continue;
      const A = num(e["Precio Gasoleo A"]), P = num(e["Precio Gasoleo Premium"]);
      if (A == null && P == null) continue;
      est.push({ id: e.IDEESS, lat: coord(e.Latitud), lon: coord(e["Longitud (WGS84)"]), A, P, dA: null, dP: null,
        rotulo: e["Rótulo"], dir: e["Dirección"], loc: e.Localidad, horario: e.Horario });
    }
    return { actualizado: j.Fecha, estaciones: est };
  }
  async function cargarDatos() {
    try {
      const r = await fetch("data/diesel.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw 0;
      return desdeCompacto(await r.json());
    } catch {
      $("cargandoTxt").textContent = "Consultando al Ministerio";
      const r = await fetch(API);
      if (!r.ok) throw new Error("api");
      return desdeApi(await r.json());
    }
  }

  // ---------- mapa ----------
  const mapa = L.map("mapa", { zoomControl: false, attributionControl: true, preferCanvas: false }).setView(st.centro, 13);
  mapa.attributionControl.setPrefix(false);
  const oscuro = () => {
    const t = document.documentElement.dataset.theme;
    return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  };
  let capa;
  function ponerTeselas() {
    if (capa) mapa.removeLayer(capa);
    const estilo = oscuro() ? "dark_all" : "rastertiles/voyager";
    capa = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${estilo}/{z}/{x}/{y}{r}.png`, {
      subdomains: "abcd", maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a> · © <a href="https://carto.com/attributions">CARTO</a> · Datos: MITECO'
    }).addTo(mapa);
    document.querySelector('meta[name="theme-color"]').content = oscuro() ? "#0C1115" : "#EEF1F3";
  }
  ponerTeselas();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ponerTeselas);

  const grupo = L.layerGroup().addTo(mapa);
  let circulo = null, marcaYo = null;
  const marcadores = new Map();

  function tier(p, q1, q3) { return p == null ? "" : p <= q1 ? "t-good" : p >= q3 ? "t-bad" : "t-mid"; }

  // ---------- cálculo ----------
  function calcular() {
    const c = st.centro, R = st.radio, prod = st.prod;
    const dLat = R / 111, dLon = R / (111 * Math.cos(c[0] * Math.PI / 180));
    let v = [];
    for (const e of st.estaciones) {
      if (e.lat == null || Math.abs(e.lat - c[0]) > dLat || Math.abs(e.lon - c[1]) > dLon) continue;
      const p = e[prod]; if (p == null) continue;
      const d = dist(c, [e.lat, e.lon]); if (d > R) continue;
      const ab = abiertaAhora(e.horario);
      if (st.soloAbiertas && ab === false) continue;
      v.push({ e, p, d, ab, delta: e["d" + prod] });
    }
    const precios = v.map(x => x.p).sort((a, b) => a - b);
    const q = f => precios.length ? precios[Math.min(precios.length - 1, Math.floor(f * (precios.length - 1)))] : null;
    const q1 = q(.25), q3 = q(.75);
    v.forEach(x => x.t = tier(x.p, q1, q3));
    const porPrecio = [...v].sort((a, b) => a.p - b.p || a.d - b.d);
    porPrecio.forEach((x, i) => x.rank = i + 1);
    st.visibles = st.orden === "dist" ? [...v].sort((a, b) => a.d - b.d) : porPrecio;
    st.stats = precios.length ? {
      min: precios[0], max: precios[precios.length - 1],
      media: precios.reduce((s, x) => s + x, 0) / precios.length, mejor: porPrecio[0]
    } : null;
  }

  // ---------- pintar ----------
  function pintarMapa() {
    grupo.clearLayers(); marcadores.clear();
    if (circulo) mapa.removeLayer(circulo);
    circulo = L.circle(st.centro, { radius: st.radio * 1000, color: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim(), weight: 1.5, opacity: .55, fillOpacity: .04, dashArray: "4 6", interactive: false }).addTo(mapa);
    const z = mapa.getZoom();
    for (const x of st.visibles) {
      const pill = z >= 13 || x.rank <= 8 || x.e.id === st.sel;
      const html = pill
        ? `<div class="pin ${x.t} ${x.rank === 1 ? "top" : ""} ${x.e.id === st.sel ? "sel" : ""}">${eur(x.p)}</div>`
        : `<div class="punto ${x.t}"></div>`;
      const m = L.marker([x.e.lat, x.e.lon], {
        icon: L.divIcon({ className: "divpin", html, iconSize: [0, 0] }),
        zIndexOffset: x.e.id === st.sel ? 2000 : pill ? 1000 - x.rank : -x.rank, keyboard: false
      }).addTo(grupo);
      m.on("click", () => seleccionar(x.e.id, false));
      marcadores.set(x.e.id, { m, x });
    }
  }

  function flecha(delta) {
    if (delta == null) return "";
    if (Math.abs(delta) < 0.0005) return `<span class="delta igual">= ayer</span>`;
    return delta < 0
      ? `<span class="delta baja">▼ ${eur(-delta)}</span>`
      : `<span class="delta sube">▲ ${eur(delta)}</span>`;
  }
  function badge(ab) { return ab === true ? `<span class="badge abierta">Abierta</span>` : ab === false ? `<span class="badge cerrada">Cerrada</span>` : ""; }

  function pintarLista() {
    const ul = $("lista");
    if (!st.visibles.length) {
      ul.innerHTML = `<li class="vacio"><strong>Nada en ${st.radio} km</strong>Amplía el radio o busca en otra zona.</li>`;
      return;
    }
    ul.innerHTML = st.visibles.map(x => `
      <li class="fila ${x.e.id === st.sel ? "sel" : ""}" data-id="${esc(x.e.id)}" tabindex="0">
        <div class="pos">${x.rank}</div>
        <div style="min-width:0">
          <div class="nom">${esc(x.e.rotulo || "Sin marca")}</div>
          <div class="dir">${esc(titulo(x.e.dir))} · ${esc(titulo(x.e.loc))}</div>
          <div class="meta"><span class="num" style="font-size:13px">${km(x.d)}</span>${badge(x.ab)}</div>
        </div>
        <div class="der"><div class="p ${x.t}">${eur(x.p)}</div>${flecha(x.delta)}</div>
      </li>`).join("");
  }

  function pintarCabecera() {
    const s = st.stats, etq = st.prod === "A" ? "Gasóleo A" : "Gasóleo Premium";
    $("mejorEtq").textContent = etq;
    if (!s) {
      $("mejorPrecio").innerHTML = "—<small>€/L</small>";
      $("mejorNombre").textContent = "Sin resultados"; $("mejorSub").textContent = "Prueba con un radio mayor";
      ["rMedia", "rMax", "rAhorro"].forEach(i => $(i).textContent = "—"); return;
    }
    const b = s.mejor;
    $("mejorPrecio").innerHTML = `${eur(b.p)}<small>€/L</small>`;
    $("mejorNombre").textContent = b.e.rotulo || "Sin marca";
    $("mejorSub").textContent = `${km(b.d)} · ${titulo(b.e.dir)}`;
    $("rMedia").textContent = eur(s.media);
    $("rMax").textContent = eur(s.max);
    $("rAhorroK").textContent = `Ahorro ${st.litros} L`;
    $("rAhorro").textContent = eur((s.media - s.min) * st.litros, 2) + " €";
  }

  function pintarControles() {
    document.querySelectorAll("[data-radio]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.radio === st.radio));
    document.querySelectorAll("[data-orden]").forEach(b => b.setAttribute("aria-pressed", b.dataset.orden === st.orden));
    $("soloAbiertas").setAttribute("aria-pressed", st.soloAbiertas);
    $("deposito").textContent = `Depósito ${st.litros} L`;
    $("pA").setAttribute("aria-pressed", st.prod === "A");
    $("pP").setAttribute("aria-pressed", st.prod === "P");
  }

  function refrescar(encuadrar) {
    calcular(); pintarControles(); pintarCabecera(); pintarLista(); pintarMapa();
    if (encuadrar) mapa.fitBounds(L.latLng(st.centro).toBounds(st.radio * 2000), { paddingTopLeft: [innerWidth >= 900 ? 430 : 20, 80], paddingBottomRight: [20, innerWidth >= 900 ? 20 : (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sheet-h")) || 300) + 16] });
  }

  // ---------- selección ----------
  function popupHtml(x) {
    const e = x.e;
    const pr = (k, lab) => {
      const v = e[k];
      const t = k === st.prod ? x.t : "";
      return `<div class="pr"><div class="etq">${lab}</div><div class="v ${t}">${v == null ? "—" : eur(v)}</div></div>`;
    };
    return `<div class="pop">
      <div><div class="nom">${esc(e.rotulo || "Sin marca")}</div><div class="dir">${esc(titulo(e.dir))}, ${esc(titulo(e.loc))} · ${km(x.d)}</div></div>
      <div class="precios">${pr("A", "Gasóleo A")}${pr("P", "Premium")}</div>
      <div class="horario">${badge(x.ab)} ${esc(e.horario || "")}</div>
      <a class="ir" href="https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lon}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>Cómo llegar</a>
    </div>`;
  }
  function seleccionar(id, volar) {
    st.sel = id;
    const it = st.visibles.find(x => x.e.id === id); if (!it) return;
    pintarMapa();
    document.querySelectorAll(".fila").forEach(f => f.classList.toggle("sel", f.dataset.id === id));
    const f = document.querySelector(`.fila[data-id="${CSS.escape(id)}"]`);
    if (f) f.scrollIntoView({ block: "nearest", behavior: "smooth" });
    if (volar) { expandir(false); mapa.flyTo([it.e.lat, it.e.lon], Math.max(mapa.getZoom(), 15), { duration: .6 }); }
    L.popup({ offset: [0, -30], autoPanPaddingTopLeft: [20, 90], autoPanPaddingBottomRight: [20, innerWidth >= 900 ? 20 : (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sheet-h")) || 300) + 16], closeButton: true })
      .setLatLng([it.e.lat, it.e.lon]).setContent(popupHtml(it)).openOn(mapa);
  }
  mapa.on("popupclose", () => { if (st.sel) { st.sel = null; document.querySelectorAll(".fila.sel").forEach(f => f.classList.remove("sel")); } });

  // ---------- hoja ----------
  function altoHoja() {
    if (innerWidth >= 900) return;
    const h = st.expandida ? Math.round(innerHeight * .78) : Math.min(330, Math.round(innerHeight * .44));
    document.documentElement.style.setProperty("--sheet-h", h + "px");
    mapa.invalidateSize();
  }
  function expandir(v) { st.expandida = v; altoHoja(); }
  $("tirador").onclick = () => expandir(!st.expandida);
  addEventListener("resize", altoHoja);
  // arrastre del tirador
  (() => {
    let y0 = null;
    const t = $("tirador");
    t.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, { passive: true });
    t.addEventListener("touchend", e => {
      if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null;
      if (dy < -30) expandir(true); else if (dy > 30) expandir(false);
    });
  })();
  $("lista").addEventListener("scroll", () => { if (!st.expandida && $("lista").scrollTop > 40) expandir(true); }, { passive: true });

  // ---------- eventos ----------
  $("lista").addEventListener("click", e => { const f = e.target.closest(".fila"); if (f) seleccionar(f.dataset.id, true); });
  $("lista").addEventListener("keydown", e => { if (e.key === "Enter") { const f = e.target.closest(".fila"); if (f) seleccionar(f.dataset.id, true); } });
  $("mejor").onclick = () => st.stats && seleccionar(st.stats.mejor.e.id, true);
  document.querySelectorAll("[data-radio]").forEach(b => b.onclick = () => { st.radio = +b.dataset.radio; guardar("radio", st.radio); refrescar(true); });
  document.querySelectorAll("[data-orden]").forEach(b => b.onclick = () => { st.orden = b.dataset.orden; guardar("orden", st.orden); refrescar(false); $("lista").scrollTop = 0; });
  $("soloAbiertas").onclick = () => { st.soloAbiertas = !st.soloAbiertas; guardar("abiertas", st.soloAbiertas); refrescar(false); };
  $("deposito").onclick = () => { st.litros = LITROS_OPC[(LITROS_OPC.indexOf(st.litros) + 1) % LITROS_OPC.length]; guardar("litros", st.litros); pintarControles(); pintarCabecera(); };
  $("pA").onclick = () => { st.prod = "A"; guardar("prod", "A"); refrescar(false); };
  $("pP").onclick = () => { st.prod = "P"; guardar("prod", "P"); refrescar(false); };

  let zAnt = mapa.getZoom();
  mapa.on("zoomend", () => { const z = mapa.getZoom(); if ((z >= 13) !== (zAnt >= 13)) pintarMapa(); zAnt = z; });
  mapa.on("moveend", () => {
    const d = dist(st.centro, [mapa.getCenter().lat, mapa.getCenter().lng]);
    $("buscarAqui").hidden = d < Math.max(1, st.radio * .5);
  });
  $("buscarAqui").onclick = () => {
    const c = mapa.getCenter(); st.centro = [c.lat, c.lng]; guardar("centro", st.centro);
    $("buscarAqui").hidden = true; $("btnYo").classList.remove("activo"); st.sel = null; refrescar(false);
  };

  function ponerYo(p) {
    if (marcaYo) marcaYo.setLatLng(p);
    else marcaYo = L.marker(p, { icon: L.divIcon({ className: "divpin", html: '<div class="yo"></div>', iconSize: [0, 0] }), interactive: false, zIndexOffset: 3000 }).addTo(mapa);
  }
  function localizar(primera) {
    if (!navigator.geolocation) { if (!primera) aviso("Tu navegador no permite ubicación"); return Promise.resolve(false); }
    return new Promise(res => navigator.geolocation.getCurrentPosition(pos => {
      st.yo = [pos.coords.latitude, pos.coords.longitude]; st.centro = st.yo; guardar("centro", st.centro);
      ponerYo(st.yo); $("btnYo").classList.add("activo"); $("buscarAqui").hidden = true; res(true);
    }, err => {
      aviso(err.code === 1 ? "Sin permiso de ubicación: mostrando tu última zona" : "No se pudo obtener tu ubicación");
      res(false);
    }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 60000 }));
  }
  $("btnYo").onclick = async () => { if (await localizar(false)) { st.sel = null; refrescar(true); } };

  // ---------- arranque ----------
  (async () => {
    altoHoja();
    // animación de dígitos mientras carga
    const dg = $("digs"); let n = 0;
    const tick = setInterval(() => { n = (n + 7) % 1000; dg.textContent = "1," + String(n).padStart(3, "0"); }, 60);
    const ubic = localizar(true);
    try {
      const d = await cargarDatos();
      st.estaciones = d.estaciones;
      const m = String(d.actualizado || "").match(/(\d{1,2})\/(\d{1,2})\/\d{4}\s+(\d{1,2}:\d{2})/);
      $("actualizado").textContent = m ? `Precios ${m[1].padStart(2, "0")}/${m[2].padStart(2, "0")} · ${m[3]} h` : "Precios del Ministerio";
    } catch {
      clearInterval(tick); dg.textContent = "--,---"; $("cargandoTxt").textContent = "No se pudieron cargar los precios";
      return;
    }
    await ubic;
    clearInterval(tick);
    refrescar(true);
    $("cargando").classList.add("fuera");
    setTimeout(() => $("cargando").remove(), 500);
  })();
})();
</script>
</body>
</html>

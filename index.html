<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diésel Cerca</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diésel Cerca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Diseño claro único: blanco, compacto y legible al sol */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#F5F7F9; --surface-3:#E9EDF1;
  --ink:#101820; --ink-2:#34414C; --muted:#6B7883; --faint:#9AA5AE; --line:#E6EAEE;
  --accent:#1B63E8; --accent-ink:#FFFFFF; --accent-soft:#EAF1FE;
  --good:#0B8F55; --good-soft:#E4F5EC; --mid:#B7791F; --mid-soft:#FBF1E0; --bad:#D2353C; --bad-soft:#FCE9EA;
  /* colores de precio (se reutilizan en marcadores y fichas) */
  --led-good:#0B8F55; --led-mid:#B7791F; --led-bad:#D2353C; --led-dim:#9AA5AE; --totem:#FFFFFF;
  --glass:rgba(255,255,255,.92);
  --sh-1:0 1px 2px rgba(16,24,32,.06),0 2px 8px rgba(16,24,32,.06);
  --sh-2:0 12px 36px rgba(16,24,32,.14),0 2px 6px rgba(16,24,32,.06);
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.4 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cap{font:700 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- mapa ---------- */
#mapa{position:fixed;inset:0;background:#E9ECEF;z-index:0}
.leaflet-container{font:inherit;background:#E9ECEF}
.leaflet-control-attribution{font-size:9px;background:transparent!important;color:var(--faint)}
.leaflet-control-attribution a{color:var(--faint)}
.leaflet-bottom{bottom:var(--sheet-h,0px);transition:bottom .35s cubic-bezier(.2,.8,.2,1)}
.divpin{background:none;border:0}

/* ---------- barra superior ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:500;padding:calc(var(--st) + 8px) 10px 0;display:flex;gap:8px;align-items:center;pointer-events:none}
.top > *{pointer-events:auto}
.marca{display:flex;align-items:center;gap:9px;min-width:0;flex:1;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-radius:14px;padding:6px 10px 6px 6px;box-shadow:var(--sh-1)}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#2B74FF 0%,#1B55D6 55%,#0E3AA6 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 6px rgba(27,85,214,.35);display:grid;place-items:center;flex:none}
.marca-txt{min-width:0}
.marca-txt b{display:block;font:800 15px/1.05 var(--body);letter-spacing:-.01em;white-space:nowrap}
.marca-txt > span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.vivo{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px;box-shadow:0 0 0 2.5px var(--good-soft)}
.seg{display:flex;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:12px;padding:3px;box-shadow:var(--sh-1);flex:none}
.seg button{padding:8px 11px;border-radius:9px;font:700 13px/1 var(--body);color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- controles del mapa ---------- */
.fabs{position:fixed;right:10px;z-index:450;bottom:calc(var(--sheet-h,300px) + 10px);transition:bottom .35s cubic-bezier(.2,.8,.2,1)}
.fab{width:42px;height:42px;border-radius:12px;background:var(--surface);box-shadow:var(--sh-1);display:grid;place-items:center;color:var(--muted)}
.fab svg{width:19px;height:19px}
.fab.on{color:var(--accent)}
.pildora{position:fixed;left:50%;top:calc(var(--st) + 62px);transform:translateX(-50%);z-index:460;background:var(--surface);color:var(--accent);padding:9px 14px;border-radius:999px;font:700 13px/1 var(--body);box-shadow:var(--sh-2);display:flex;gap:7px;align-items:center;white-space:nowrap}
.pildora svg{width:14px;height:14px}
.toast{position:fixed;left:50%;top:calc(var(--st) + 62px);transform:translateX(-50%);z-index:700;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;max-width:calc(100% - 32px);box-shadow:var(--sh-2)}

/* ---------- marcadores ---------- */
.pin{position:relative;display:inline-flex;align-items:center;gap:4px;transform:translate(-50%,calc(-100% - 5px));background:#fff;border-radius:8px;padding:4px 7px 3px 6px;box-shadow:0 2px 8px rgba(16,24,32,.18),0 0 0 1px rgba(16,24,32,.06);white-space:nowrap;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}
.pin i{width:6px;height:6px;border-radius:50%;background:var(--mid)}
.pin b{font:700 14.5px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.pin.g i{background:var(--good)} .pin.r i{background:var(--bad)}
.pin .mejor{display:none}
.pin.top1{background:var(--good)} .pin.top1::after{border-top-color:var(--good)}
.pin.top1 i{background:#fff} .pin.top1 b{color:#fff}
.pin.sel{background:var(--ink);transform:translate(-50%,calc(-100% - 5px)) scale(1.18);z-index:9}
.pin.sel::after{border-top-color:var(--ink)} .pin.sel b{color:#fff}
.punto{width:10px;height:10px;border-radius:50%;background:var(--mid);border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(16,24,32,.35)}
.punto.g{background:var(--good)} .punto.r{background:var(--bad)}
.yo{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;transform:translate(-50%,-50%);animation:latido 2.2s infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(27,99,232,.4),0 1px 5px rgba(0,0,0,.3)}70%{box-shadow:0 0 0 16px rgba(27,99,232,0),0 1px 5px rgba(0,0,0,.3)}100%{box-shadow:0 0 0 0 rgba(27,99,232,0),0 1px 5px rgba(0,0,0,.3)}}

/* ---------- hoja ---------- */
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:600;height:var(--sheet-h,300px);background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -6px 28px rgba(16,24,32,.12);display:flex;flex-direction:column;transition:height .35s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sb);will-change:height}
.hoja.arrastrando{transition:none}
.asa{flex:none;padding:7px 0 2px;display:grid;place-items:center;touch-action:none;cursor:grab}
.asa span{width:36px;height:4px;border-radius:2px;background:var(--surface-3)}
.vista{flex:1;min-height:0;display:flex;flex-direction:column}
.vista[hidden]{display:none!important}
.cab{flex:none;padding:2px 14px 10px;display:flex;flex-direction:column;gap:10px;touch-action:none}

.titulo-zona{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.titulo-zona h2{margin:0;font:800 18px/1.1 var(--body);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titulo-zona .n{font-size:12px;color:var(--muted);white-space:nowrap}

/* tarjeta de la mejor */
.mejor-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--good-soft);border-radius:14px;padding:9px 10px 9px 12px;text-align:left;width:100%}
.totem{background:transparent;padding:0;min-width:0}
.mejor-card .totem .cap{display:none}
.totem .p{font:700 32px/1 var(--display);color:var(--good);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.005em}
.totem .p small{font:600 12px/1 var(--body);color:var(--good);opacity:.75;margin-left:2px}
.mejor-card .info{min-width:0;border-left:1px solid rgba(11,143,85,.18);padding-left:12px}
.mejor-card .info .cap{color:var(--good);font-size:10px}
.mejor-card .nom{font:700 15px/1.15 var(--body);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mejor-card .sub{font-size:12px;color:var(--ink-2);opacity:.75;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir-mini{width:34px;height:34px;border-radius:10px;background:var(--good);color:#fff;display:grid;place-items:center}
.ir-mini svg{width:16px;height:16px}

/* distribución compacta */
.dist{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.dist-top{display:contents}
.dist-top .cap{display:none}
.dist-top .ah{grid-column:2;grid-row:1 / span 2;align-self:center;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.25;white-space:nowrap}
.dist-top .ah b{display:block;color:var(--good);font:700 19px/1 var(--display);font-variant-numeric:tabular-nums}
.hist{grid-column:1;grid-row:1;position:relative;height:24px;display:flex;align-items:flex-end;gap:2px}
.hist i{flex:1;border-radius:2px 2px 1px 1px;min-height:2px}
.hist .media{position:absolute;top:-3px;bottom:-2px;width:0;border-left:1.5px solid var(--ink)}
.escala{grid-column:1;grid-row:2;display:flex;justify-content:space-between;font:700 12.5px/1 var(--display);font-variant-numeric:tabular-nums}
.escala .a{color:var(--good)} .escala .m{color:var(--ink-2)} .escala .z{color:var(--bad)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface-2);border-radius:999px;padding:7px 11px;font:600 12.5px/1 var(--body);color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px}
.sep{flex:none;width:1px;background:var(--line);margin:4px 1px}

.lista{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0;padding:0 0 16px;list-style:none;border-top:1px solid var(--line)}
.fila{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.fila:active{background:var(--surface-2)}
@media (hover:hover){.fila:hover{background:var(--surface-2)}}
.mono{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 12px/1 var(--body);letter-spacing:.01em;color:#fff;position:relative;flex:none}
.mono .rk{position:absolute;right:-5px;bottom:-5px;min-width:17px;height:17px;border-radius:9px;background:#fff;color:var(--ink-2);box-shadow:0 0 0 1px var(--line);font:700 10px/17px var(--body);text-align:center;padding:0 4px;font-variant-numeric:tabular-nums}
.fila .nom{font:700 14.5px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize}
.fila .dir{display:none}
.fila .meta{display:flex;gap:7px;align-items:center;margin-top:2px;font-size:12px;color:var(--muted);min-width:0}
.fila .meta .km{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.fila .meta .calle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.est{font:700 10px/1 var(--body);letter-spacing:.02em;padding:3px 6px;border-radius:5px;white-space:nowrap}
.est.ab{background:var(--good-soft);color:var(--good)} .est.ce{background:var(--bad-soft);color:var(--bad)}
.fila .der{text-align:right}
.precio{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.precio.g{color:var(--good)} .precio.m{color:var(--ink)} .precio.r{color:var(--bad)}
.delta{display:block;margin-top:3px;font:600 11.5px/1 var(--body);font-variant-numeric:tabular-nums}
.delta.b{color:var(--good)} .delta.s{color:var(--bad)} .delta.i{color:var(--faint)}
.vacio{padding:28px 24px;text-align:center;color:var(--muted);font-size:13.5px}
.vacio b{display:block;color:var(--ink);font:800 16px/1.2 var(--body);margin-bottom:4px}
.skel{height:52px;margin:8px 14px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- ficha ---------- */
.det{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 14px 18px;display:flex;flex-direction:column;gap:10px}
.det-cab{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;touch-action:none}
.det-cab .mono{width:42px;height:42px;border-radius:12px;font-size:14px}
.det-cab h3{margin:0;font:800 18px/1.15 var(--body);letter-spacing:-.01em;text-transform:capitalize}
.det-cab .dir{font-size:12.5px;color:var(--muted);margin-top:1px}
.cerrar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);align-self:start}
.cerrar svg{width:14px;height:14px}
.tablero{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tablero .totem{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.tablero .totem:first-child{background:var(--good-soft)}
.tablero .totem .p{font-size:30px;margin-top:4px}
.tablero .totem.off .p{color:var(--faint)!important}
.tablero .totem .d{font:600 11.5px/1 var(--body);margin-top:5px;color:var(--muted)}
.tablero .totem .d.b{color:var(--good)} .tablero .totem .d.s{color:var(--bad)}
.hechos{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px}
.hechos > div{padding:9px 12px}
.hechos > div + div{border-left:1px solid var(--line)}
.hechos .v{font:700 18px/1.1 var(--display);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap}
.hechos .v.g{color:var(--good)} .hechos .v.r{color:var(--bad)}
.horario{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--ink-2);padding:2px 2px}
.horario svg{width:16px;height:16px;flex:none;color:var(--muted)}
.rutas{display:grid;grid-template-columns:1fr auto auto;gap:7px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:12px 14px;font:700 14px/1 var(--body);text-decoration:none;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface-2);color:var(--ink);font-weight:600;font-size:13.5px;padding:12px}

@media (min-width:900px){
  .hoja{left:10px;right:auto;width:400px;top:calc(var(--st) + 64px);bottom:10px;height:auto!important;border-radius:18px;box-shadow:var(--sh-2)}
  .asa{display:none}
  .cab{padding-top:12px}
  .fabs{bottom:20px}
  .leaflet-bottom{bottom:0}
  .marca{flex:0 1 400px}
  .seg{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="mapa" aria-label="Mapa de gasolineras"></div>

<header class="top">
  <div class="marca">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M12 2.2c-4.3 0-7.8 3.3-7.8 7.5 0 5.4 7.8 12.1 7.8 12.1s7.8-6.7 7.8-12.1c0-4.2-3.5-7.5-7.8-7.5z"/><path fill="#16C47F" d="M12 5.4s-3 3.3-3 5.3a3 3 0 0 0 6 0c0-2-3-5.3-3-5.3z"/></svg>
    </div>
    <div class="marca-txt">
      <b>Diésel Cerca</b>
      <span id="actualizado">Cargando precios…</span>
    </div>
  </div>
  <div class="seg" role="group" aria-label="Carburante">
    <button id="pA" aria-pressed="true">Diésel</button>
    <button id="pP" aria-pressed="false">Diésel+</button>
  </div>
</header>

<button class="pildora" id="buscarAqui" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  Buscar en esta zona
</button>
<div class="toast" id="toast" hidden></div>

<div class="fabs">
  <button class="fab" id="btnYo" aria-label="Ir a mi ubicación">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 2.3a1 1 0 0 0-1.1-.2l-18 8a1 1 0 0 0 .1 1.9l7.4 2 2 7.4a1 1 0 0 0 1.9.1l8-18a1 1 0 0 0-.3-1.2z"/></svg>
  </button>
</div>

<section class="hoja" id="hoja" aria-label="Gasolineras">
  <div class="asa" id="asa"><span></span></div>

  <div class="vista" id="vLista">
    <div class="cab" id="cabLista">
      <div class="titulo-zona">
        <h2 id="zona">Cerca de ti</h2>
        <span class="n" id="cuantas"></span>
      </div>
      <button class="mejor-card" id="mejor">
        <div class="totem"><div class="cap" id="mejorEtq">Gasóleo A</div><div class="p" id="mejorPrecio">–,–––<small>€/L</small></div></div>
        <div class="info">
          <div class="cap">La más barata</div>
          <div class="nom" id="mejorNom">Buscando…</div>
          <div class="sub" id="mejorSub">&nbsp;</div>
        </div>
        <span class="ir-mini" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>
      <div class="dist" id="dist">
        <div class="dist-top"><span class="cap">Precios en la zona</span><span class="ah" id="ahorro"></span></div>
        <div class="hist" id="hist"></div>
        <div class="escala"><span class="a" id="eMin">–</span><span class="m" id="eMed"></span><span class="z" id="eMax">–</span></div>
      </div>
      <div class="chips" role="toolbar" aria-label="Filtros">
        <button class="chip" data-radio="5">5 km</button>
        <button class="chip" data-radio="10">10 km</button>
        <button class="chip" data-radio="20">20 km</button>
        <button class="chip" data-radio="30">30 km</button>
        <button class="chip" data-radio="50">50 km</button>
        <span class="sep"></span>
        <button class="chip" data-orden="precio">Más barata</button>
        <button class="chip" data-orden="dist">Más cerca</button>
        <span class="sep"></span>
        <button class="chip" id="soloAbiertas"><span class="dot"></span>Abiertas</button>
        <button class="chip" id="deposito">Depósito 50 L</button>
      </div>
    </div>
    <ul class="lista" id="lista">
      <li class="skel"></li><li class="skel"></li><li class="skel"></li>
    </ul>
  </div>

  <div class="vista" id="vDet" hidden>
    <div class="det" id="det"></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  "use strict";
  const PATERNA = [39.5025, -0.4406];
  const API = "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/";
  const LITROS = [40, 50, 60, 70];
  const $ = id => document.getElementById(id);

  // ---------- almacenamiento local ----------
  const leer = (k, d) => { try { const v = localStorage.getItem("dc2_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const grabar = (k, v) => { try { localStorage.setItem("dc2_" + k, JSON.stringify(v)); } catch {} };

  const st = {
    est: [], centro: leer("centro", PATERNA), yo: null, manual: false,
    radio: [5, 10, 20, 30, 50].includes(leer("radio", 10)) ? leer("radio", 10) : 10, orden: leer("orden", "precio"), prod: leer("prod", "A"),
    abiertas: leer("abiertas", false), litros: leer("litros", 50),
    vis: [], stats: null, sel: null, snap: 1, cargado: false
  };

  // ---------- formato ----------
  const eur = (v, d = 3) => v == null ? "–" : v.toFixed(d).replace(".", ",");
  const km = d => d < 1 ? Math.round(d * 1000 / 10) * 10 + " m" : d.toFixed(d < 10 ? 1 : 0).replace(".", ",") + " km";
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MIN = new Set(["de", "del", "la", "las", "el", "los", "y", "a", "en"]);
  const tit = s => String(s || "").toLowerCase().replace(/\s+/g, " ").trim()
    .replace(/[a-záéíóúñüç0-9ªº.'-]+/g, (w, i) => (i > 0 && MIN.has(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1));
  function marca(r) {
    let s = String(r || "").trim().replace(/\s*,?\s*S\.?\s*[AL]\.?\s*U?\.?$/i, "").trim();
    if (!s || /^n[ºo°]\s*[\d.]/i.test(s) || /^\d+$/.test(s)) return "Independiente";
    return s;
  }
  const nombre = m => m === "Independiente" ? m : String(m).toLowerCase().split(/\s+/).map(w => w.length <= 3 && !/^(de|del|la|el|los|las|y)$/.test(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
  const COL = { REPSOL: "#F07C00", CEPSA: "#D6282E", MOEVE: "#00857C", BP: "#009A44", SHELL: "#E8B400", GALP: "#EE5A24", PLENOIL: "#00A3DA", BALLENOIL: "#1B75BB", PETROPRIX: "#E30613", AVIA: "#C4161C", CARREFOUR: "#1E4FA1", ALCAMPO: "#D1242A", PLENERGY: "#6A2C91", ESCLATOIL: "#2E9A47", "LOW COST": "#333F48", DISA: "#E2001A" };
  function colorMarca(n) {
    const u = n.toUpperCase();
    for (const k in COL) if (u.startsWith(k) || u.includes(" " + k)) return COL[k];
    let h = 0; for (const c of u) h = (h * 31 + c.charCodeAt(0)) % 360;
    return `hsl(${h} 32% 38%)`;
  }
  const iniciales = n => n === "Independiente" ? "IND" : n.replace(/[^A-Za-zÁÉÍÓÚÑ0-9 ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "·";

  function dist(a, b) {
    const r = x => x * Math.PI / 180, dLa = r(b[0] - a[0]), dLo = r(b[1] - a[1]);
    const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLo / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(h));
  }
  function toast(t, ms = 3200) { const e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, ms); }

  // Horario: "L-V: 06:00-22:00; S: 07:00-14:00" · "L-D: 24H"
  const DIAS = "LMXJVSD";
  function abierta(h, now = new Date()) {
    if (!h) return null;
    const hoy = (now.getDay() + 6) % 7, m = now.getHours() * 60 + now.getMinutes();
    let ok = false;
    for (const seg of h.toUpperCase().split(";")) {
      const x = seg.match(/^\s*([LMXJVSD])(?:\s*-\s*([LMXJVSD]))?\s*:\s*(.+)$/);
      if (!x) continue; ok = true;
      const a = DIAS.indexOf(x[1]), b = x[2] ? DIAS.indexOf(x[2]) : a;
      if (!(a <= b ? hoy >= a && hoy <= b : hoy >= a || hoy <= b)) continue;
      if (/24\s*H/.test(x[3])) return true;
      for (const r of x[3].matchAll(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/g)) {
        const i = +r[1] * 60 + +r[2], f = +r[3] * 60 + +r[4];
        if (f > i ? m >= i && m < f : m >= i || m < f) return true;
      }
    }
    return ok ? false : null;
  }
  function horarioBonito(h) {
    if (!h) return "Horario no disponible";
    if (/^\s*L-D:\s*24H\s*$/i.test(h)) return "Abierta 24 horas, todos los días";
    return h.replace(/L-D/g, "Todos los días").replace(/L-V/g, "Lun–Vie").replace(/L-S/g, "Lun–Sáb").replace(/S-D/g, "Sáb–Dom")
      .replace(/\bS:/g, "Sáb:").replace(/\bD:/g, "Dom:").replace(/;/g, " · ");
  }

  // ---------- datos ----------
  const num = s => { if (s == null || s === "") return null; const v = parseFloat(String(s).replace(",", ".")); return isFinite(v) && v > 0 ? v : null; };
  const coord = s => { const v = parseFloat(String(s ?? "").replace(",", ".")); return isFinite(v) ? v : null; };
  const deCompacto = j => ({ fecha: j.actualizado, est: j.estaciones.map(e => ({ id: String(e[0]), lat: e[1], lon: e[2], A: e[3], P: e[4], dA: e[5], dP: e[6], rot: e[7], dir: e[8], loc: e[9], hor: e[10] })) });
  function deApi(j) {
    const est = [];
    for (const e of j.ListaEESSPrecio || []) {
      if (e["Tipo Venta"] && e["Tipo Venta"] !== "P") continue;
      const A = num(e["Precio Gasoleo A"]), P = num(e["Precio Gasoleo Premium"]);
      if (A == null && P == null) continue;
      est.push({ id: String(e.IDEESS), lat: coord(e.Latitud), lon: coord(e["Longitud (WGS84)"]), A, P, dA: null, dP: null, rot: e["Rótulo"], dir: e["Dirección"], loc: e.Localidad, hor: e.Horario });
    }
    return { fecha: j.Fecha, est };
  }
  async function cargar() {
    try {
      const r = await fetch("data/diesel.json?t=" + Math.floor(Date.now() / 300000), { cache: "no-store" });
      if (!r.ok) throw 0;
      return deCompacto(await r.json());
    } catch {
      const r = await fetch(API);
      if (!r.ok) throw new Error("api");
      return deApi(await r.json());
    }
  }

  // ---------- mapa ----------
  const mapa = L.map("mapa", { zoomControl: false, attributionControl: true, zoomSnap: .25 }).setView(st.centro, 13);
  mapa.attributionControl.setPrefix(false);
  const esOscuro = () => false;
  let teselas;
  function ponerTeselas() {
    if (teselas) mapa.removeLayer(teselas);
    const tono = esOscuro() ? "Dark" : "Light";
    const base = n => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${tono}_Gray_${n}/MapServer/tile/{z}/{y}/{x}`;
    teselas = L.layerGroup([
      L.tileLayer(base("Base"), { maxNativeZoom: 16, maxZoom: 19, attribution: "Mapa © Esri · Precios: MITECO" }),
      L.tileLayer(base("Reference"), { maxNativeZoom: 16, maxZoom: 19 })
    ]).addTo(mapa);
    
  }
  ponerTeselas();
  
  const capa = L.layerGroup().addTo(mapa);
  let circulo = null, marcaYo = null;

  // ---------- cálculo ----------
  function calcular() {
    const c = st.centro, R = st.radio, p = st.prod;
    const dLa = R / 111, dLo = R / (111 * Math.cos(c[0] * Math.PI / 180));
    const v = [];
    for (const e of st.est) {
      if (e.lat == null || Math.abs(e.lat - c[0]) > dLa || Math.abs(e.lon - c[1]) > dLo) continue;
      const pr = e[p]; if (pr == null) continue;
      const d = dist(c, [e.lat, e.lon]); if (d > R) continue;
      const ab = abierta(e.hor);
      if (st.abiertas && ab === false) continue;
      v.push({ e, p: pr, d, ab, delta: e["d" + p], marca: marca(e.rot) });
    }
    const ps = v.map(x => x.p).sort((a, b) => a - b);
    const q = f => ps[Math.min(ps.length - 1, Math.floor(f * (ps.length - 1)))];
    const q1 = q(.25), q3 = q(.75);
    for (const x of v) x.t = x.p <= q1 ? "g" : x.p >= q3 ? "r" : "m";
    const porPrecio = [...v].sort((a, b) => a.p - b.p || a.d - b.d);
    porPrecio.forEach((x, i) => x.rk = i + 1);
    st.vis = st.orden === "dist" ? [...v].sort((a, b) => a.d - b.d) : porPrecio;
    st.stats = ps.length ? { min: ps[0], max: ps[ps.length - 1], media: ps.reduce((s, x) => s + x, 0) / ps.length, mejor: porPrecio[0], ps } : null;
    // Nombre de la zona: localidad más repetida entre las 5 más cercanas
    const cerca = [...v].sort((a, b) => a.d - b.d).slice(0, 5);
    const cnt = {}; cerca.forEach(x => { const l = tit(x.e.loc); cnt[l] = (cnt[l] || 0) + 1; });
    const art = z => z.replace(/^(.*?)\s*\((el|la|els|les|los|las|l')\)$/i, (m, a, b) => b.charAt(0).toUpperCase() + b.slice(1).toLowerCase() + (b.endsWith("'") ? "" : " ") + a);
    st.zona = art(Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || "Esta zona");
  }

  // ---------- pintar ----------
  const acc = () => getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  function pintarMapa() {
    capa.clearLayers();
    if (circulo) mapa.removeLayer(circulo);
    circulo = L.circle(st.centro, { radius: st.radio * 1000, color: acc(), weight: 1.5, opacity: .5, fillColor: acc(), fillOpacity: .035, dashArray: "3 7", interactive: false }).addTo(mapa);
    const z = mapa.getZoom();
    for (const x of st.vis) {
      const s = x.e.id === st.sel;
      const pill = z >= 13.5 || x.rk <= 8 || s;
      const html = pill
        ? `<div class="pin ${x.t === "g" ? "g" : x.t === "r" ? "r" : ""} ${x.rk === 1 ? "top1" : ""} ${s ? "sel" : ""}"><i></i><b>${eur(x.p)}</b></div>`
        : `<div class="punto ${x.t === "g" ? "g" : x.t === "r" ? "r" : ""}"></div>`;
      L.marker([x.e.lat, x.e.lon], { icon: L.divIcon({ className: "divpin", html, iconSize: [0, 0] }), zIndexOffset: s ? 5000 : pill ? 2000 - x.rk : -x.rk, keyboard: false })
        .on("click", () => abrirDetalle(x.e.id, false)).addTo(capa);
    }
  }

  const deltaHtml = d => d == null ? "" : Math.abs(d) < .0005 ? `<span class="delta i">= ayer</span>` : d < 0 ? `<span class="delta b">▼ ${eur(-d)}</span>` : `<span class="delta s">▲ ${eur(d)}</span>`;
  const estHtml = a => a === true ? `<span class="est ab">Abierta</span>` : a === false ? `<span class="est ce">Cerrada</span>` : "";
  const monoHtml = (x, rk) => `<span class="mono" style="background:${colorMarca(x.marca)}">${esc(iniciales(x.marca))}${rk ? `<span class="rk">${rk}</span>` : ""}</span>`;

  function pintarLista() {
    const ul = $("lista");
    if (!st.vis.length) { ul.innerHTML = `<li class="vacio"><b>Nada en ${st.radio} km</b>Amplía el radio o busca en otra zona.</li>`; return; }
    ul.innerHTML = st.vis.map(x => `
      <li class="fila" data-id="${esc(x.e.id)}" tabindex="0">
        ${monoHtml(x, x.rk)}
        <div style="min-width:0">
          <div class="nom">${esc(nombre(x.marca))}</div>
          <div class="meta"><span class="km">${km(x.d)}</span>${estHtml(x.ab)}<span class="calle">${esc(tit(x.e.dir))}</span></div>
        </div>
        <div class="der"><div class="precio ${x.t}">${eur(x.p)}</div>${deltaHtml(x.delta)}</div>
      </li>`).join("");
  }

  function pintarCabecera() {
    const s = st.stats;
    $("mejorEtq").textContent = st.prod === "A" ? "Gasóleo A" : "Gasóleo Premium";
    $("zona").textContent = s ? st.zona : "Sin resultados";
    $("cuantas").textContent = s ? `${st.vis.length} en ${st.radio} km` : "";
    if (!s) {
      $("mejorPrecio").innerHTML = "–,–––<small>€/L</small>"; $("mejorNom").textContent = "Nada cerca"; $("mejorSub").textContent = "Prueba con un radio mayor";
      $("hist").innerHTML = ""; $("eMin").textContent = $("eMax").textContent = "–"; $("eMed").textContent = ""; $("ahorro").textContent = ""; return;
    }
    const b = s.mejor;
    $("mejorPrecio").innerHTML = `${eur(b.p)}<small>€/L</small>`;
    $("mejorNom").textContent = nombre(b.marca);
    $("mejorSub").textContent = `${km(b.d)} · ${tit(b.e.dir)}`;
    $("ahorro").innerHTML = `<b>${eur((s.media - s.min) * st.litros, 2)} €</b>ahorro en ${st.litros} L`;
    // histograma
    const N = 22, lo = s.min, hi = s.max, w = (hi - lo) || .001, bins = Array(N).fill(0);
    for (const p of s.ps) bins[Math.min(N - 1, Math.floor((p - lo) / w * N))]++;
    const mx = Math.max(...bins);
    const col = i => { const t = i / (N - 1); return t < .33 ? "var(--good)" : t > .66 ? "var(--bad)" : "var(--mid)"; };
    const posMed = ((s.media - lo) / w) * 100;
    $("hist").innerHTML = bins.map((n, i) => `<i style="height:${n ? Math.max(10, n / mx * 100) : 6}%;background:${n ? col(i) : "var(--surface-3)"}"></i>`).join("") +
      `<div class="media" style="left:${Math.min(98, Math.max(2, posMed))}%"></div>`;
    $("eMin").textContent = eur(s.min); $("eMax").textContent = eur(s.max); $("eMed").textContent = "Media " + eur(s.media);
  }

  function pintarControles() {
    document.querySelectorAll("[data-radio]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.radio === st.radio));
    document.querySelectorAll("[data-orden]").forEach(b => b.setAttribute("aria-pressed", b.dataset.orden === st.orden));
    $("soloAbiertas").setAttribute("aria-pressed", st.abiertas);
    $("deposito").textContent = `Depósito ${st.litros} L`;
    $("pA").setAttribute("aria-pressed", st.prod === "A"); $("pP").setAttribute("aria-pressed", st.prod === "P");
  }

  function refrescar(encuadrar) {
    pintarControles();
    if (!st.cargado) return;
    calcular(); pintarCabecera(); pintarLista(); pintarMapa();
    if (st.sel) { const it = st.vis.find(x => x.e.id === st.sel); if (it) pintarDetalle(it); else cerrarDetalle(); }
    if (encuadrar) encuadre();
  }
  function padInferior() { return innerWidth >= 900 ? 20 : alturaSnap(st.snap) + 16; }
  function encuadre() {
    st.tocado = false; $("buscarAqui").hidden = true;
    mapa.fitBounds(L.latLng(st.centro).toBounds(st.radio * 2000), { paddingTopLeft: [innerWidth >= 900 ? 440 : 16, 80], paddingBottomRight: [16, padInferior()], animate: true });
  }

  // ---------- detalle ----------
  function pintarDetalle(x) {
    const e = x.e, s = st.stats, otro = st.prod === "A" ? "P" : "A";
    const dHtml = d => d == null ? "" : Math.abs(d) < .0005 ? `<div class="d">Igual que ayer</div>` : `<div class="d ${d < 0 ? "b" : "s"}">${d < 0 ? "▼" : "▲"} ${eur(Math.abs(d))} vs ayer</div>`;
    const tot = (k, lab) => {
      const v = e[k], on = k === st.prod;
      const colTxt = on ? (x.t === "g" ? "var(--led-good)" : x.t === "r" ? "var(--led-bad)" : "var(--led-mid)") : "";
      return `<div class="totem ${v == null ? "off" : ""}"><div class="cap">${lab}</div><div class="p" style="${v == null ? "" : on ? `color:${colTxt}` : "color:var(--ink)"}">${v == null ? "–,–––" : eur(v)}<small>€/L</small></div>${dHtml(e["d" + k])}</div>`;
    };
    const dif = s ? x.p - s.media : 0;
    const url = `${e.lat},${e.lon}`;
    $("det").innerHTML = `
      <div class="det-cab" id="detCab">
        ${monoHtml(x, 0)}
        <div style="min-width:0"><h3>${esc(nombre(x.marca))}</h3><div class="dir">${esc(tit(e.dir))}, ${esc(tit(e.loc))}</div></div>
        <button class="cerrar" id="cerrarDet" aria-label="Volver a la lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="tablero">${tot(st.prod, st.prod === "A" ? "Gasóleo A" : "Gasóleo Premium")}${tot(otro, otro === "A" ? "Gasóleo A" : "Gasóleo Premium")}</div>
      <div class="hechos">
        <div><div class="cap">Distancia</div><div class="v">${km(x.d)}</div></div>
        <div><div class="cap">Puesto</div><div class="v">${x.rk}º <span style="font-size:13px;color:var(--muted)">de ${st.vis.length}</span></div></div>
        <div><div class="cap">Vs media</div><div class="v ${dif <= 0 ? "g" : "r"}">${dif <= 0 ? "−" : "+"}${eur(Math.abs(dif) * st.litros, 2)} €</div></div>
      </div>
      <div class="horario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div>${estHtml(x.ab)} ${esc(horarioBonito(e.hor))}</div></div>
      <div class="rutas">
        <a class="btn pri" href="https://www.google.com/maps/dir/?api=1&destination=${url}&travelmode=driving" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 2.3a1 1 0 0 0-1.1-.2l-18 8a1 1 0 0 0 .1 1.9l7.4 2 2 7.4a1 1 0 0 0 1.9.1l8-18a1 1 0 0 0-.3-1.2z"/></svg>Cómo llegar</a>
        <a class="btn sec" href="https://maps.apple.com/?daddr=${url}&dirflg=d" target="_blank" rel="noopener">Apple</a>
        <a class="btn sec" href="https://waze.com/ul?ll=${url}&navigate=yes" target="_blank" rel="noopener">Waze</a>
      </div>`;
    $("cerrarDet").onclick = cerrarDetalle;
  }
  function abrirDetalle(id, volar) {
    const x = st.vis.find(v => v.e.id === id); if (!x) return;
    st.sel = id;
    pintarDetalle(x);
    $("vLista").hidden = true; $("vDet").hidden = false; $("det").scrollTop = 0;
    if (innerWidth < 900) ponerSnap(1);
    pintarMapa();
    const pt = mapa.project([x.e.lat, x.e.lon], Math.max(mapa.getZoom(), 15));
    const off = innerWidth >= 900 ? [-210, 0] : [0, (alturaSnap(1) - 60) / 2];
    const destino = mapa.unproject(pt.add(off), Math.max(mapa.getZoom(), 15));
    if (volar) mapa.flyTo(destino, Math.max(mapa.getZoom(), 15), { duration: .6 }); else mapa.panTo(destino, { animate: true });
  }
  function cerrarDetalle() {
    st.sel = null; $("vDet").hidden = true; $("vLista").hidden = false; pintarMapa();
  }

  // ---------- hoja arrastrable ----------
  const hoja = $("hoja");
  function alturaSnap(i) {
    const H = innerHeight;
    return [Math.min(236, H * .32), Math.min(H * .56, 520), H * .86][i] | 0;
  }
  function ponerSnap(i) {
    st.snap = i;
    if (innerWidth >= 900) { document.documentElement.style.setProperty("--sheet-h", "0px"); return; }
    document.documentElement.style.setProperty("--sheet-h", alturaSnap(i) + "px");
  }
  (() => {
    let y0, h0, t0, activo = false, movido = false;
    const inicio = e => {
      if (innerWidth >= 900) return;
      if (e.target.closest(".chips, a, .cerrar")) return;
      activo = true; movido = false; y0 = e.clientY; h0 = hoja.getBoundingClientRect().height; t0 = performance.now();
      hoja.classList.add("arrastrando");
    };
    const mover = e => {
      if (!activo) return;
      const dy = e.clientY - y0;
      if (Math.abs(dy) > 4) movido = true;
      if (!movido) return;
      const h = Math.max(alturaSnap(0) * .8, Math.min(innerHeight * .92, h0 - dy));
      hoja.style.height = h + "px";
    };
    const fin = e => {
      if (!activo) return; activo = false; hoja.classList.remove("arrastrando");
      if (!movido) { hoja.style.height = ""; return; }
      const h = hoja.getBoundingClientRect().height, v = (e.clientY - y0) / Math.max(1, performance.now() - t0);
      hoja.style.height = "";
      let i;
      if (v < -.5) i = Math.min(2, st.snap + 1);
      else if (v > .5) i = Math.max(0, st.snap - 1);
      else { const hs = [0, 1, 2].map(alturaSnap); i = hs.reduce((b, x, k) => Math.abs(x - h) < Math.abs(hs[b] - h) ? k : b, 0); }
      ponerSnap(i);
      e.preventDefault();
    };
    for (const el of [$("asa"), $("cabLista"), $("vDet")]) el.addEventListener("pointerdown", inicio);
    addEventListener("pointermove", mover, { passive: true });
    addEventListener("pointerup", fin); addEventListener("pointercancel", fin);
    // evitar que un arrastre se convierta en clic
    hoja.addEventListener("click", e => { if (movido) { e.stopPropagation(); e.preventDefault(); movido = false; } }, true);
  })();
  $("asa").addEventListener("click", () => ponerSnap(st.snap === 2 ? 1 : 2));
  $("lista").addEventListener("scroll", () => { if (st.snap < 2 && $("lista").scrollTop > 30) ponerSnap(2); }, { passive: true });
  addEventListener("resize", () => ponerSnap(st.snap));

  // ---------- eventos ----------
  $("lista").addEventListener("click", e => { const f = e.target.closest(".fila"); if (f) abrirDetalle(f.dataset.id, true); });
  $("lista").addEventListener("keydown", e => { if (e.key === "Enter") { const f = e.target.closest(".fila"); if (f) abrirDetalle(f.dataset.id, true); } });
  $("mejor").onclick = () => st.stats && abrirDetalle(st.stats.mejor.e.id, true);
  document.querySelectorAll("[data-radio]").forEach(b => b.onclick = () => { st.radio = +b.dataset.radio; grabar("radio", st.radio); refrescar(true); });
  document.querySelectorAll("[data-orden]").forEach(b => b.onclick = () => { st.orden = b.dataset.orden; grabar("orden", st.orden); refrescar(false); $("lista").scrollTop = 0; });
  $("soloAbiertas").onclick = () => { st.abiertas = !st.abiertas; grabar("abiertas", st.abiertas); refrescar(false); };
  $("deposito").onclick = () => { st.litros = LITROS[(LITROS.indexOf(st.litros) + 1) % LITROS.length]; grabar("litros", st.litros); pintarControles(); if (st.cargado) { pintarCabecera(); if (st.sel) { const it = st.vis.find(x => x.e.id === st.sel); if (it) pintarDetalle(it); } } };
  $("pA").onclick = () => { st.prod = "A"; grabar("prod", "A"); refrescar(false); };
  $("pP").onclick = () => { st.prod = "P"; grabar("prod", "P"); refrescar(false); };

  let zAnt = mapa.getZoom();
  mapa.on("zoomend", () => { const z = mapa.getZoom(); if ((z >= 13.5) !== (zAnt >= 13.5)) pintarMapa(); zAnt = z; });
  mapa.on("dragstart", () => { st.tocado = true; });
  mapa.on("moveend", () => {
    const c = mapa.getCenter();
    if (!st.tocado) return;
    const d = dist(st.centro, [c.lat, c.lng]);
    $("buscarAqui").hidden = !st.cargado || d < Math.max(1.5, st.radio * .5);
  });
  $("buscarAqui").onclick = () => {
    const c = mapa.getCenter(); st.centro = [c.lat, c.lng]; st.manual = true; st.tocado = false; grabar("centro", st.centro);
    $("buscarAqui").hidden = true; $("btnYo").classList.remove("on"); cerrarDetalle(); refrescar(false);
  };

  function ponerYo(p) {
    if (marcaYo) marcaYo.setLatLng(p);
    else marcaYo = L.marker(p, { icon: L.divIcon({ className: "divpin", html: '<div class="yo"></div>', iconSize: [0, 0] }), interactive: false, zIndexOffset: 9000 }).addTo(mapa);
  }
  function localizar(avisar) {
    if (!navigator.geolocation) { if (avisar) toast("Este navegador no permite la ubicación"); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      st.yo = [pos.coords.latitude, pos.coords.longitude]; ponerYo(st.yo);
      if (!st.manual || avisar) {
        st.centro = st.yo; st.manual = false; grabar("centro", st.centro);
        $("btnYo").classList.add("on"); $("buscarAqui").hidden = true; cerrarDetalle(); refrescar(true);
      }
    }, err => {
      if (avisar || err.code === 1) toast(err.code === 1 ? "Activa la ubicación para ver lo que tienes cerca" : "No se pudo obtener tu ubicación");
    }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  }
  $("btnYo").onclick = () => localizar(true);

  // ---------- arranque (el mapa se ve desde el primer momento) ----------
  ponerSnap(1);
  pintarControles();
  localizar(false);
  cargar().then(d => {
    st.est = d.est; st.cargado = true;
    const m = String(d.fecha || "").match(/(\d{1,2})\/(\d{1,2})\/\d{4}\s+(\d{1,2}):(\d{2})/);
    $("actualizado").innerHTML = `<span class="vivo"></span>` + (m ? `Precios de hoy ${m[3]}:${m[4]} h` : "Precios oficiales");
    if (m) {
      const hoy = new Date(); if (+m[1] !== hoy.getDate() || +m[2] !== hoy.getMonth() + 1) $("actualizado").innerHTML = `<span class="vivo" style="background:var(--mid)"></span>Precios del ${m[1]}/${m[2]} · ${m[3]}:${m[4]} h`;
    }
    refrescar(true);
  }).catch(() => {
    $("actualizado").textContent = "No se pudieron cargar los precios";
    $("lista").innerHTML = `<li class="vacio"><b>Sin conexión con los precios</b>Revisa la conexión y vuelve a abrir la app.</li>`;
    $("mejorNom").textContent = "Sin datos";
  });
})();
</script>
</body>
</html>
